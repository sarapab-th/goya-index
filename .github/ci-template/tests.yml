# Inactive template. Move to .github/workflows/tests.yml after workflow publishing
# permission is granted. This file does not run in GitHub Actions at this path.
name: Portable package tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Synthetic source tests (no provider calls)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -B -m unittest discover -s tests -v
